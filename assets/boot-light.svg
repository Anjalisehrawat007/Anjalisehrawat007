  <radialGradient id="g2-b" cx="0.95" cy="1" r="0.7"><stop offset="0" stop-color="rgba(14,143,168,0.10)"/><stop offset="1" stop-color="rgba(14,143,168,0.10)" stop-opacity="0"/></radialGradient>
  <clipPath id="clip-b"><rect width="1000" height="440" rx="18"/></clipPath>
  <filter id="soft-b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<g clip-path="url(#clip-b)"><rect width="1000" height="440" fill="#ffffff"/><rect width="1000" height="440" fill="url(#grid-b)"/><rect width="1000" height="440" fill="url(#g1-b)"/><rect width="1000" height="440" fill="url(#g2-b)"/></g>
