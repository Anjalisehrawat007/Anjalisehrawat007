<circle r="3.5" fill="#0e8fa8"><animateMotion dur="4.5s" repeatCount="indefinite" path="M 700 150 L 700 382" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" repeatCount="indefinite"/></circle>
<circle r="3.5" fill="#0e8fa8"><animateMotion dur="4.5s" begin="2.2s" repeatCount="indefinite" path="M 700 150 L 700 382" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" begin="2.2s" repeatCount="indefinite"/></circle>
