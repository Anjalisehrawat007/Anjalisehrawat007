<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="ANJALI.SYS boot screen — Identity: Anjali Sehrawat. Role: Software Engineer. Focus: AI/ML, Full-Stack, Backend. Current build: RareCare. System status: online.">
<defs>
